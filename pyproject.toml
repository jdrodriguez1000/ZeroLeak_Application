[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zeroleak"
version = "0.1.0"
description = "Auditor de fugas de dinero ocultas en los datos (COQD). Motor local determinista."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }
authors = [{ name = "Triple S" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

# El comando de consola es `zlk` (el paquete Python es `zeroleak`).
[project.scripts]
zlk = "zeroleak.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app/src/zeroleak"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["app/src"]
